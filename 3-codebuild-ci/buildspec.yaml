version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - REPOSITORY_NAME="my-app"
      - IMAGE_REPO_NAME="$REGISTRY/$REPOSITORY_NAME"
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - echo "$IMAGE_REPO_NAME:$IMAGE_TAG"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
      - REPOSITORY_URI="$IMAGE_REPO_NAME"
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building Docker image on `date`"
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      - echo "Running security scan..."
      - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image $REPOSITORY_URI:latest || true
      - echo "Running tests..."
      - docker run --rm $REPOSITORY_URI:latest npm test || true

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing the Docker image to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definitions file..."
      - printf '[{"name":"my-app","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "Uploading artifacts to S3..."
      - aws s3 cp imagedefinitions.json s3://${ARTIFACT_BUCKET}/imagedefinitions.json

artefacts:
  files: imagedefinitions.json
  name: BuildArtifact

cache:
  paths:
    - '/root/.m2/**/*'
    - '/root/.npm/**/*'
    - '/root/.cache/**/*'

reports:
  security-scan:
    files:
      - 'trivy-report.json'
    file-format: 'JSON'
  unit-tests:
    files:
      - 'test-results.xml'
    file-format: 'JUNITXML'

logs:
  cloudwatch:
    group-name: /aws/codebuild/my-app-build
    stream-name: build-stream
